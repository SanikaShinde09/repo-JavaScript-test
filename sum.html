<html>
    <body>
        
    <div>
        <label for="">number1</label>
        <input type="number" id="number1" value="">

        <label for="">number2</label>
        <input type="number" id="number2" value="">

    </div>

    <button onclick="sumoftwo()">Add</button>

    <div id="output"></div>

    <script>
        function sumoftwo() {
            const number1 = document.getElementById("number1").value;
            const number2 = document.getElementById("number2").value;
            const sum = Number(number1) + Number(number2);

            document.getElementById("output").innerHTML = `
            sum of two : ${number1} and ${number2} :<b>{sum}</b>
            ${number1} + ${number2} = <b>${sum}</b>`
        }
    </script>
    </body>
</html>
