<html>
    <body>
        <div>
        <label for="">product:</label>
        <input type="number" id="product">
        <label for="">qty:</label>
        <input type="number" id="qty"><br><br>
        <label for="">discount:</label>
        <input type="number" id="discount">
        <label for="">dcharge:</label>
        <input type="number" id="dcharge"><br><br>
        </div><br>
        <button onclick="save()">Data</button>

     <div id="output"></div>
     
     <script>
        function save(){
            const product = document.getElementById("product").value;
            const qty = document.getElementById("qty").value;
            const dcount = document.getElementById("discount").value;
            const dcharge = document.getElementById("dcharge").value;

            const subtotal = Number(product) * Number(qty);

            const discount = (Number(dcount) * subtotal)/100;

            const total =((subtotal-dcount)+ Number(dcharge)).toFixed(2);

            document.getElementById("output").innerHTML = `
             <h4>Summary:</h4>
            Subtotal:${subtotal}<br>
            Discount:${discount}<br>
            Delivery Charges:${dcharge}<br>
            <b>Total: </b> ${total}
            `
        }
     </script>
    </body>
</html>
