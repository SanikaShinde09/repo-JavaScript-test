<html>
    <head>
        <script>
function myFunction(x){
    x.style.background = "yellow";
}
        </script>
    </head>
    <body>
        <h1>JavaScript HTML Events</h1>
        <h2>The onfocus Attribute</h2>

        Enter your name: <input type="text"
        onfocus="myFunction(this)">
    </body>
</html>
