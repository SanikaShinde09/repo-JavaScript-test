<html>

<body>
    <h2>Javascript HTML DOM</h2>

    <form action="" id="frm1">
        First name: 
        <input type="text" name="fname" value="sanika"><br>
        Last name: 
        <input type="text" name="lname" value="shinde"><br><br>
        <input type="submit" value="Submit">
    </form>

    <p id="demo"></p>
    <script>
        const x = document.forms["frm1"];
        let text = "";
        for (let i = 0; i < x.length; i++) {
            text += x.elements[i].value + "<br>";
        }
        document.getElementById("demo").innerHTML = text;
    </script>
</body>

</html>
