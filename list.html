<html>
    <body>
        <h2>JavaScript HTML DOM</h2>

        <p>Hello World!</p>

        <p>Hello Norway!</p>

        <p>Hello World!</p>

        
        <button onclick="myFunction()">Try it</button>

        <script>
            function myFunction(){
                const myNodelist = document.querySelectorAll("p");
                for(let i = 0; i < myNodelist.length; i++){
                    myNodelist[i].style.color = "brown ";
                }
            }
        </script>
    </body>
</html>
