<html>
    <body>
        <h2>JavaScript HTML DOM</h2>
        <p>Remove an HTML element</p>

        <div>
            <p id="p1">This is a paragraph</p>
            <p id="p2">This is an another paragraph</p>
        </div>
        <button onclick="myFunction()">Remove Element</button>

        <script>
            function myFunction(){
                document.getElementById("p1").remove();
            }
        </script>
    </body>
</html>
