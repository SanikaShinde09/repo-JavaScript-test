<html>
    <head>
        <style>
         #myDiv1 ,#myDiv2 {
            background-color: coral;
            padding: 50px;
            width: 100px;
         }
         #myp1 ,#myp2 {
            background-color: white;
            font-size: 20px;
            border: 1px solid;
            padding: 20px;
         }
        </style>
    </head>
    <body>
        
        <h2>Javascript addEventListener()</h2>

        <div id="myDiv1">
            <h2>Bubbling:</h2>
            <p id="myp1">Click me!</p>
        </div><br>

         <div id="myDiv2">
            <h2>Bubbling:</h2>
            <p id="myp2">Click me!</p>
        </div><br>
        <script>
            document.getElementById("myp1").addEventListener("click",
                function(){
                    alert("You clicked the white element!");
                },false);

          document.getElementById("myDiv1").addEventListener("click",
            function(){
                alert("You clicked the orange element!");
            },false);
            
            document.getElementById("myp2").addEventListener("click",
                function(){
                    alert("You clicked the white element!");
                },true );

                 document.getElementById("myDiv2").addEventListener("click",
            function(){
                alert("You clicked the orange element!");
            },true);
        </script>
    </body>
</html>
