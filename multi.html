<html>
    <body>
        <div>
            <label for="">Number</label>
            <input type="Number" id="num" value="">

            <button onclick="twotable()">Table</button>
</div>
            <div id="output">

            </div>
            <script>
                function twotable(){
                    const Number = document.getElementById("num").value;
                    let i = 1;
                    let output = "";
                    for(i;i<=10;i++)
                {
                    const sum = Number * i;
                    output += `${Number} * ${i} = ${sum} <br>`
                }
                document.getElementById("output").innerHTML = output;
                }
            </script>
        
    </body>
</html>
